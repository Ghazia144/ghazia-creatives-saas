@font-face{font-family:'Cinzel Decorative';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/cinzel-decorative-latin-400-normal.woff2) format('woff2')}

html.iw *,html.iw *::before,html.iw *::after{animation-play-state:paused!important}

:root{--indigo:#14102B;--plum:#2A1B4D;--gold:#D4AF37;--champagne:#F3E3B3;--blush:#E8B4C8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;max-width:100%}
html,body{background:var(--indigo);color:var(--champagne);font-family:'Cormorant Garamond',serif}
body.lock{overflow:hidden;height:100%}

#intro{position:fixed;inset:0;z-index:20;background:var(--indigo) center/cover no-repeat;cursor:default;transition:opacity 1.8s ease}
#intro.ready{cursor:pointer}
#intro.fade{opacity:0;pointer-events:none}
#intro video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hint{position:absolute;left:50%;bottom:11%;transform:translateX(-50%);padding:.8rem 1.8rem;white-space:nowrap;
  font-family:'Cinzel Decorative',serif;font-size:clamp(.8rem,3.4vw,1.1rem);letter-spacing:.25em;color:var(--champagne);
  border:1px solid var(--gold);border-radius:50px;background:rgba(20,16,43,.55);backdrop-filter:blur(4px);
  animation:pulse 2.4s ease-in-out infinite;transition:opacity .6s}
@keyframes pulse{0%,100%{box-shadow:0 0 10px rgba(212,175,55,.3)}50%{box-shadow:0 0 30px rgba(243,227,179,.8)}}
#intro.playing .hint{opacity:0;animation:none}

#hero{position:relative;height:100vh;height:100svh;overflow:hidden;background:var(--indigo)}
.bg{position:absolute;inset:-4%;background:var(--u-hero) center/cover;transform:scale(1.18);
  transition:transform 22s cubic-bezier(.2,.5,.3,1)}
#hero.on .bg{transform:scale(1.02)}
.mist{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 60%,#fff2c8 0%,rgba(243,227,179,.9) 30%,rgba(212,175,55,.5) 60%,rgba(42,27,77,.6) 100%);
  opacity:1;transition:opacity 4s ease 0.3s}
#hero.on .mist{opacity:0}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 55%,transparent 55%,rgba(10,6,25,.65) 100%)}
canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

.title{position:absolute;left:0;right:0;top:7%;height:34%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;pointer-events:none}
.names{
  font-family:'Great Vibes',cursive;
  font-weight:400;
  line-height:1;
  font-size:min(23vw,15vh);
  white-space:nowrap;
  color:#F7E9BE;
  text-shadow:0 0 6px rgba(255,236,170,.55),0 0 22px rgba(212,175,55,.6),0 2px 0 rgba(120,85,10,.45);
  opacity:0;
  transition:opacity 2.4s ease;
  animation:glowname 5s ease-in-out infinite alternate;
}

@keyframes glowname{
  from{filter:brightness(1)}
  to{filter:brightness(1.18)}
}

.names span{display:block;padding:0 .3em}
.date{padding:0 1.4rem;position:absolute;left:0;right:0;top:calc(7% + 34%);text-align:center;opacity:0;transition:opacity 2s ease;
  font-family:'Cinzel Decorative',serif;letter-spacing:.3em;font-size:clamp(.75rem,3.2vw,1.05rem);color:var(--blush);text-shadow:0 0 10px #000}
.date small{display:block;margin-top:.8rem;font-family:'Cormorant Garamond',serif;font-style:italic;letter-spacing:.08em;font-size:1.25em;color:var(--champagne)}
#hero.named .names{opacity:1}
#hero.named .date{opacity:1}

.scroll{position:absolute;left:50%;bottom:3.5%;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity 2s ease;
  font-size:.95rem;letter-spacing:.2em;color:var(--champagne);text-shadow:0 0 8px #000}
.scroll i{display:block;width:1px;height:34px;margin:.5rem auto 0;background:linear-gradient(var(--champagne),transparent);animation:drip 2s ease-in-out infinite}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
#hero.ready .scroll{opacity:.9}

#venue{position:relative;height:100vh;height:100svh;background:#0c0820;overflow:hidden}
.vstage{position:relative;height:100%;width:min(100vw,56.25vh);width:min(100vw,calc(100svh*.5625));margin:0 auto;overflow:hidden}
.vstage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .9s ease}
#v2{opacity:0}
.vstage.ride #v2{opacity:1} .vstage.ride #v1{opacity:0}
.vflash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 48% 70%,#fff6d6,rgba(243,227,179,.6) 35%,transparent 70%)}
.vstage.flash .vflash{animation:vf 1.1s ease-out}
@keyframes vf{0%{opacity:0}35%{opacity:1}100%{opacity:0}}
.vtease{position:absolute;left:0;right:0;top:14%;text-align:center;font-family:'Great Vibes',cursive;font-size:clamp(2rem,10vw,3.4rem);
  color:var(--champagne);text-shadow:0 0 18px rgba(212,175,55,.7);transition:opacity .8s}
.vstage.go .vtease{opacity:0}
.taptag{position:absolute;left:48%;top:80%;transform:translate(-50%,-50%);width:92px;height:92px;border-radius:50%;cursor:pointer;
  border:1.5px solid var(--champagne);background:rgba(20,16,43,.35);backdrop-filter:blur(2px);
  font-family:'Cinzel Decorative',serif;font-size:1rem;letter-spacing:.2em;color:var(--champagne);animation:ring 2s ease-in-out infinite;transition:opacity .5s}
.taptag span{padding-left:.2em}
@keyframes ring{0%,100%{box-shadow:0 0 0 0 rgba(243,227,179,.7),0 0 18px rgba(212,175,55,.5)}60%{box-shadow:0 0 0 22px rgba(243,227,179,0),0 0 28px rgba(212,175,55,.8)}}
.vstage.go .taptag{opacity:0;pointer-events:none}
.vcard{position:absolute;left:6%;right:6%;top:5%;padding:1.7rem 1.1rem 1.4rem;text-align:center;border:1.5px solid #D4AF37;border-radius:4px;
  background:radial-gradient(ellipse at 50% 0%,rgba(96,64,150,.5),transparent 70%),linear-gradient(160deg,rgba(38,24,70,.88),rgba(16,12,38,.92));
  box-shadow:0 0 0 4px rgba(16,12,38,.65),0 0 0 5.5px rgba(212,175,55,.55),0 0 40px rgba(212,175,55,.32),inset 0 0 28px rgba(212,175,55,.12);
  opacity:0;transform:translateY(14px);transition:opacity 1s ease,transform 1s ease;pointer-events:none;max-height:80vh;overflow-y:auto;overflow-x:hidden}
.vcard.show{opacity:1;transform:none;pointer-events:auto}
.vcard .k{font-family:'Cinzel Decorative',serif;font-size:.82rem;letter-spacing:.38em;color:#F3C9D8;margin-bottom:.35rem}
.vcard .k::after{content:'';display:block;width:46%;height:1px;margin:.7rem auto .2rem;background:linear-gradient(90deg,transparent,#D4AF37,transparent)}
.again{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);background:none;border:0;color:var(--champagne);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1rem;letter-spacing:.1em;opacity:0;pointer-events:none;transition:opacity 1s;cursor:pointer;text-shadow:0 0 8px #000}
.again.show{opacity:.85;pointer-events:auto}

#rsvp{position:relative;min-height:100vh;min-height:100svh;overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center;padding:2rem 1rem 3.4rem;
  background:linear-gradient(180deg,rgba(12,8,32,.38) 0%,rgba(12,8,32,.12) 45%,rgba(12,8,32,.45) 100%),var(--u-rsvp) 50% 50%/cover no-repeat,#0c0820}
.rstars,.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.rstars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff3c8;box-shadow:0 0 6px 1px rgba(243,227,179,.8);animation:bulb var(--d) ease-in-out infinite}
.rhead,.rbox,.rctl{position:relative;z-index:2}
.rt{font-family:'Great Vibes',cursive;font-weight:400;font-size:clamp(2.6rem,12vw,3.6rem);line-height:1.1;margin:.3rem 0 .2rem;color:var(--champagne);text-shadow:0 0 18px rgba(212,175,55,.65)}
.rbox{height:min(60vh,60svh,560px);aspect-ratio:9/16;
  -webkit-mask-image:linear-gradient(transparent 0,#000 11%,#000 89%,transparent 100%),linear-gradient(90deg,transparent 0,#000 13%,#000 87%,transparent 100%);
  -webkit-mask-composite:source-in;mask-image:linear-gradient(transparent 0,#000 11%,#000 89%,transparent 100%),linear-gradient(90deg,transparent 0,#000 13%,#000 87%,transparent 100%);mask-composite:intersect}
.rbox>*{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rvid{opacity:0;transition:opacity 1s ease}.rvid.on{opacity:1}
.rglow{background:radial-gradient(circle at 50% 37%,rgba(255,190,90,.30),transparent 42%);mix-blend-mode:screen;animation:aura 4s ease-in-out infinite;pointer-events:none}
.rsp i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff3c8;box-shadow:0 0 7px 2px rgba(243,200,120,.8);animation:bulb var(--d) ease-in-out infinite}
.rctl{width:min(92vw,340px);margin-top:.2rem}
.rbtns{display:flex;flex-direction:column;gap:.7rem;transition:opacity .6s,max-height .8s;max-height:200px}
.rctl.chosen .rbtns{opacity:0;max-height:0;overflow:hidden;pointer-events:none}
.rbtns button{padding:.95rem;border-radius:40px;cursor:pointer;font-family:'Cinzel Decorative',serif;font-size:.78rem;letter-spacing:.14em}
.ryes{border:0;color:#2a1b4d;background:linear-gradient(135deg,#F3E3B3,#D4AF37);box-shadow:0 0 20px rgba(212,175,55,.6)}
.rno{background:rgba(20,16,43,.5);color:var(--champagne);border:1px solid rgba(212,175,55,.7)}
.rmsg{opacity:0;transform:translateY(10px);transition:opacity 1.3s ease,transform 1.3s ease}
.rmsg.show{opacity:1;transform:none}
.rmsg h3{font-family:'Great Vibes',cursive;font-weight:400;font-size:clamp(2rem,9vw,2.6rem);line-height:1.15;color:var(--champagne);text-shadow:0 0 16px rgba(212,175,55,.6)}
.rmsg p{font-style:italic;font-size:1.15rem;margin-top:.4rem;opacity:.9}
.rform{margin-top:1rem;text-align:left;opacity:0;pointer-events:none;transition:opacity 1.2s ease}
.rform.show{opacity:1;pointer-events:auto}
.rform label{display:block;font-family:'Cinzel Decorative',serif;font-size:.6rem;letter-spacing:.18em;color:var(--blush);margin-top:.8rem;text-transform:uppercase}
.rform label i{text-transform:none;letter-spacing:.04em;font-family:'Cormorant Garamond',serif;font-size:.95rem;color:var(--champagne)}
.rform input{display:block;width:100%;background:transparent;border:0;border-bottom:1.5px solid rgba(212,175,55,.65);padding:.4rem .1rem;font-family:'Cormorant Garamond',serif;font-size:1.2rem;color:var(--champagne);outline:none}
.rform input:focus{border-bottom-color:#fff3c8}
.rform input::placeholder{color:rgba(243,227,179,.4);font-style:italic}
.rg{display:flex;justify-content:space-between;align-items:center;margin-top:.9rem;font-family:'Cinzel Decorative',serif;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--blush)}
.rg.hide{display:none}
.rstep{display:flex;align-items:center;gap:.7rem}
.rstep button{width:30px;height:30px;border-radius:50%;border:1px solid rgba(212,175,55,.7);background:transparent;font-size:1.1rem;color:var(--champagne);cursor:pointer}
.rstep b{font-family:'Cormorant Garamond',serif;font-size:1.4rem;min-width:1.2rem;text-align:center;color:var(--champagne)}
.rwa{display:block;text-align:center;margin-top:1.2rem;padding:.9rem;border-radius:40px;text-decoration:none;font-family:'Cinzel Decorative',serif;font-size:.72rem;letter-spacing:.14em;color:#2a1b4d;
  background:linear-gradient(135deg,#F3E3B3,#D4AF37);box-shadow:0 0 18px rgba(212,175,55,.65);transition:opacity .4s}
.rwa.off{opacity:.4;pointer-events:none}
.rnote{margin-top:.7rem;font-size:.95rem;font-style:italic;opacity:.75;text-align:center}
.rchange{display:block;margin:.6rem auto 0;background:none;border:0;color:var(--champagne);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1rem;opacity:.8;cursor:pointer;text-decoration:underline}
.credit{position:absolute;z-index:6;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + .9rem);text-align:center;font-size:.95rem;letter-spacing:.18em;color:#F3E3B3;opacity:.9;text-shadow:0 0 10px rgba(212,175,55,.6),0 0 4px #000}
.gd{position:absolute;bottom:-10px;width:4px;height:4px;border-radius:50%;background:#fff3c8;box-shadow:0 0 8px 2px rgba(243,200,120,.85);opacity:0;animation:rise var(--d) linear infinite}
.pt{position:absolute;top:-24px;width:11px;height:15px;border-radius:80% 0 80% 0;background:radial-gradient(circle at 30% 30%,#e0405a,#8a1030);opacity:0;animation:fall var(--d) linear infinite}
@keyframes fall{0%{opacity:0;transform:translate(0,0) rotate(0)}10%{opacity:.85}100%{opacity:.7;transform:translate(var(--sx),108vh) rotate(560deg)}}
@media (prefers-reduced-motion:reduce){.bg,.mist{transition-duration:.01s}.names{animation:none}}

.hint{opacity:0;pointer-events:none}
#intro.ready .hint{opacity:1;pointer-events:auto}
#intro.playing .hint{opacity:0;pointer-events:none}
.ildr{position:absolute;left:50%;bottom:calc(11% + 1.2rem);transform:translateX(-50%);width:min(46vw,190px);height:2px;background:rgba(243,227,179,.22);border-radius:2px;overflow:hidden;transition:opacity .5s}
.ildr i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#D4AF37,#F3E3B3);transform:scaleX(var(--p,.06));transform-origin:left;transition:transform .35s ease}
#intro.ready .ildr,#intro.playing .ildr{opacity:0}
html.go{--u-venue:url(img/venue-poster.webp)}
@media (min-aspect-ratio:9/16){
  #venue::before{content:'';position:absolute;inset:-6%;z-index:0;background:var(--u-venue) center/cover;filter:blur(26px) brightness(.6);pointer-events:none}
  #venue .vstage{z-index:1;box-shadow:0 0 0 1px rgba(212,175,55,.5),0 0 60px rgba(212,175,55,.2)}
}
.rlink{color:var(--champagne);text-decoration:underline;transition:opacity .3s}
.rlink:hover{opacity:.75}

  box-shadow:0 0 0 2.5px rgba(16,12,38,.6),0 0 0 4px rgba(212,175,55,.45),0 0 16px rgba(212,175,55,.4);
  opacity:0;pointer-events:none;transform:scale(.7);transition:opacity .9s ease,transform .9s cubic-bezier(.3,.8,.3,1)}
.snd.show{opacity:1;pointer-events:auto;transform:none}

  50%{box-shadow:0 0 0 2.5px rgba(16,12,38,.6),0 0 0 4px rgba(243,227,179,.75),0 0 24px rgba(243,227,179,.7)}}

.snd .sp{fill:#fff3c8;transform-box:fill-box;transform-origin:center;animation:twk 2.4s ease-in-out infinite;transition:opacity .4s}

.snd.off .nt{opacity:.45;filter:none}
.snd.off .sp{opacity:0;animation:none}
.snd.off .sl{opacity:1}

<script>
// ==========================================
// 1. CONFIG & GLOBAL VARIABLES
// ==========================================
const CONFIG = {
  lines: ['Alizey &', 'Zain'],
  date: '30 January 2027',
  tagline: 'Together with our families, we invite you to celebrate our union',
  venue: {
    name: 'Pearl Continental',
    address: 'Club Road, Karachi',
    dayLabel: 'Saturday, 30 January 2027',
    timeLabel: 'Barat & Nikkah at 6:00 PM',
    start: '20270130T180000', end: '20270130T230000',
    dress: 'Traditional Pakistani Formal',
    mapsQuery: 'Pearl Continental, Karachi'
  },
  rsvp: { whatsapp: '923183040506' },
};
const $ = id => document.getElementById(id);
function formatTime(t) {
  if (!t) return '';
  if (/am|pm/i.test(t)) return t;
  const m = String(t).match(/^(\d{1,2}):(\d{2})/);
  if (!m) return t;
  let h = +m[1]; const min = m[2];
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return `${h}:${min} ${ampm}`;
}

function warm(v){ if(!v||v.dataset.warm) return; v.dataset.warm=1; v.preload='auto'; v.load(); }
function lazyInit(){
  const plan = [['venue',['v1']], ['rsvp',['vyes']], ['countdown',['tvA']]];
  if(!('IntersectionObserver' in window)){ plan.forEach(([,ids])=>ids.forEach(i=>warm($(i)))); return; }
  const io = new IntersectionObserver(es=>es.forEach(e=>{ if(!e.isIntersecting) return;
    io.unobserve(e.target); plan.find(p=>p[0]===e.target.id)[1].forEach(i=>warm($(i))); }), {rootMargin:'120% 0px'});
  plan.forEach(([sec])=>io.observe($(sec)));
}
['pointerdown','touchstart','mouseenter'].forEach(ev=>$('bno').addEventListener(ev,()=>warm($('vno')),{passive:true,once:true}));
const hero = $('hero'), intro = $('intro'), vid = $('vid');

const cv = $('sky'), ctx = cv.getContext('2d');
let W, H, dpr, stars = [], links = [], flies = [], t0 = 0, running = false, formed = false, raf = 0;
const REDUCED = matchMedia('(prefers-reduced-motion:reduce)').matches;

function size(){ dpr = Math.min(devicePixelRatio||1,2); W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }

async function buildTargets(){
  await Promise.race([document.fonts.load('100px "Great Vibes"'), new Promise(r=>setTimeout(r,2500))]);
  const oc = document.createElement('canvas'); oc.width = W; oc.height = H;
  const o = oc.getContext('2d');
  const boxTop = H*.07, boxH = H*.34;
  let fs = Math.min(W*.28, H*.18);
  o.font = `${fs}px "Great Vibes"`;
  const widest = Math.max(...CONFIG.lines.map(l=>o.measureText(l).width));
  if(widest > W*.86){ fs *= (W*.86)/widest; o.font = `${fs}px "Great Vibes"`; }
  $('names').style.fontSize = fs+'px';
  { const nm=$('names'); nm.textContent=''; CONFIG.lines.forEach(l=>{ const sp=document.createElement('span'); sp.textContent=l; nm.appendChild(sp); }); }
  o.fillStyle = '#2A1B4D'; o.textAlign = 'center'; o.textBaseline = 'middle';
  const lh = fs*1.0, y0 = boxTop + boxH/2 - (CONFIG.lines.length-1)*lh/2;
  CONFIG.lines.forEach((l,i)=>o.fillText(l, W/2, y0 + i*lh));
  const d = o.getImageData(0,0,W,H).data, pts = [], step = Math.max(3, Math.round(W/150));
  for(let y=0;y<H;y+=step) for(let x=0;x<W;x+=step) if(d[(y*W+x)*4+3]>128) pts.push([x,y]);

function buildEventsCarousel() {
  const c = document.getElementById('vcard');
  const events = window.__currentEvents;
  
  let slidesHTML = events.map(ev => {
    let dStr = ev.date;
    if(ev.date && ev.date.includes('-')) {
        const d = new Date(ev.date);
        if(!isNaN(d)) dStr = d.toLocaleDateString('en-US', { weekday:'short', day:'numeric', month:'short' });
    }
    let timeStr = ev.gatheringTime || '';
    let timesHTML = [];
    if (ev.gatheringTime) timesHTML.push(`<span>Gathering: ${formatTime(ev.gatheringTime)}</span>`);
    if (ev.dinnerTime) timesHTML.push(`<span>Dinner: ${formatTime(ev.dinnerTime)}</span>`);
    if (ev.rukhsatiTime) timesHTML.push(`<span>Rukhsati: ${formatTime(ev.rukhsatiTime)}</span>`);
    let when = `<div style="font-size:0.78rem; line-height:1.6; margin-top:4px; color:var(--champagne);">${timesHTML.join('<br>')}</div>`;

    return `
      <div class="ev-slide">
        <div class="ev-name">${ev.type || 'Event'}</div>
        <div class="ev-when">${dStr}</div>  <!-- Date yahan -->
        ${when}  <!-- Timings yahan -->
        ${venueLabel(ev) ? `<div class="ev-venue">${venueLabel(ev)}</div>` : ''}
      </div>
    `;
  }).join('');

  let dotsHTML = events.map((_, i) => `<span class="${i === 0 ? 'active' : ''}"></span>`).join('');

  const multi = events.length > 1;
  c.innerHTML = `
    <div class="k">THE CELEBRATIONS</div>
    <div class="ev-carousel-container">
      <button type="button" class="ev-arrow prev ${multi ? '' : 'hide'}" id="evPrev" aria-label="Previous event">&#8249;</button>
      <div class="ev-carousel" id="evCarousel">${slidesHTML}</div>
      <button type="button" class="ev-arrow next ${multi ? '' : 'hide'}" id="evNext" aria-label="Next event">&#8250;</button>
    </div>
    <div class="ev-dots" id="evDots">${dotsHTML}</div>
  `;

  c.classList.add('show');

  const scroller = document.getElementById('evCarousel');
  const dots = document.querySelectorAll('#evDots span');
  const prevBtn = document.getElementById('evPrev');
  const nextBtn = document.getElementById('evNext');

  const updateCarousel = () => {
    const idx = Math.round(scroller.scrollLeft / scroller.clientWidth);
    dots.forEach((d, i) => d.classList.toggle('active', i === idx));
    prevBtn.disabled = idx <= 0;
    nextBtn.disabled = idx >= events.length - 1;
  };
  scroller.addEventListener('scroll', updateCarousel, { passive: true });
  prevBtn.addEventListener('click', () => scroller.scrollBy({ left: -scroller.clientWidth, behavior: 'smooth' }));
  nextBtn.addEventListener('click', () => scroller.scrollBy({ left: scroller.clientWidth, behavior: 'smooth' }));
  updateCarousel();
}

        }
      }
      if (sndBtn) sndBtn.style.display = 'grid';
    }
  }

  // 4. VENUE GRID (Only Venue Info - "A Royal Celebration" Section)
  const grid = document.getElementById('eventsGrid');
  if (grid && data.events) {
    // Sirf unique venues nikaalo
    grid.classList.toggle('single-event', data.events.length === 1);
    const uniqueVenues = [];
    const seen = new Set();
    
    data.events.forEach(ev => {
      const key = (ev.venueName || '') + '|' + (ev.venueAddress || '');
      if (!seen.has(key) && ev.venueName) {
        seen.add(key);
        uniqueVenues.push(ev);
      }
    });

    grid.innerHTML = uniqueVenues.map(ev => {
        // Date nikalne ka logic
        let dStr = ev.date;
        if(ev.date && ev.date.includes('-')) {
            const d = new Date(ev.date);
            if(!isNaN(d)) dStr = d.toLocaleDateString('en-US', { weekday:'short', day:'numeric', month:'short', year:'numeric' });
        }
        const evNames = data.events
          .filter(e => (e.venueName || '') + '|' + (e.venueAddress || '') === (ev.venueName || '') + '|' + (ev.venueAddress || ''))
          .map(e => e.type).filter(Boolean).join(' & ');
        return `
          <div class="event-card">
            ${evNames ? `<div class="ev-evname">${evNames}</div>` : ''}
            <h3 style="font-size:1.6rem;">${venueLabel(ev) || 'Venue'}</h3>
            <div class="ev-date">${dStr}</div>
            <div class="ev-addr" style="margin-top:8px; font-size:0.9rem;">${ev.venueAddress || ''}</div>
            ${ev.mapsUrl ? `<a href="${ev.mapsUrl}" target="_blank" class="btn-map" style="margin-top:10px;">View Map</a>` : ''}
          </div>
        `;
    }).join('');
  }

  // 5. CAROUSEL REFRESH
  if (data.events && data.events.length > 0) {
    window.__currentEvents = data.events;
    if (document.getElementById('vcard').classList.contains('show')) {
       buildEventsCarousel();
    }
  }

  // 6. COUNTDOWN TARGET
  if (data.events && data.events.length > 0) {
    const now = new Date();
    const parsed = data.events
      .filter(e => e.date)
      .map(e => {
        const t = e.gatheringTime || '00:00';
        return { ev: e, dt: new Date(e.date + 'T' + t + ':00') };
      })
      .filter(x => !isNaN(x.dt.getTime()))
      .sort((a,b) => a.dt - b.dt);
    const next = parsed.find(x => x.dt > now) || parsed[parsed.length - 1];
    if (next) window.__countdownTarget = next.dt;
  }

  // 7. PREVIEW RESTRICTIONS
  document.body.classList.toggle('is-preview-2', isFormPreview);
  if (isFormPreview) {
    const bgm = document.getElementById('bgm');
    if (bgm) bgm.pause();
    document.querySelectorAll('#byes, #bno, #wa, #gm, #gp').forEach(el => {
      el.classList.add('is-disabled');
      if (el.tagName === 'BUTTON') el.disabled = true;
      else if (el.tagName === 'A') { el.style.pointerEvents = 'none'; el.setAttribute('aria-disabled','true'); }
    });
  }
};

window.addEventListener('message', function(e) {
  if (e.origin !== location.origin) return;
  var msg = e.data;
  
  if (msg && msg.type === 'invite-data' && msg.data) {
    
    // 1. Audio Logic
    var audioTrack = msg.data.audio_track || 'nasheed-1';
    
    // Page par jo bhi pehla <audio> tag hai, usko pakad lo (ID ki zaroorat nahi)
    var bgMusic = document.querySelector('audio'); 
    
    if (bgMusic) {
      if (audioTrack === 'none') {
        bgMusic.pause();
        bgMusic.style.display = 'none';
      } else {
        // Path set karo
        bgMusic.src = '../audio/' + audioTrack + '.mp3';
        bgMusic.style.display = 'block';
      }
    }
  }
});
